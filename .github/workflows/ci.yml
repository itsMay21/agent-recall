name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run build:plugin
      # Fail if the committed plugin bundle is stale vs a fresh build (F-2.11).
      - run: git diff --exit-code -- plugin/
